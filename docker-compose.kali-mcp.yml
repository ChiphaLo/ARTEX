# Opt-in overlay; base compose is untouched. See docs/kali-mcp-integration.md.
services:
  artex:
    environment:
      KALI_MCP_ENABLED: ${KALI_MCP_ENABLED:-false}
      KALI_MCP_URL: ${KALI_MCP_URL:-https://kali-mcp:8081/mcp}
      KALI_MCP_TOKEN: ${KALI_MCP_TOKEN:-}
      KALI_MCP_TOKEN_FILE: ${KALI_MCP_TOKEN_FILE-/run/secrets/kali-mcp/token}
      KALI_MCP_CA_CERT: ${KALI_MCP_CA_CERT:-/run/secrets/kali-mcp/service_ca.crt}
    volumes:
      - ${KALI_MCP_SECRET_DIR:-./secrets/kali-mcp}:/run/secrets/kali-mcp:ro
    networks:
      - default
      - kali-link

  kali-mcp:
    profiles: [kali]
    image: ${KALI_MCP_IMAGE:-vxcontrol/kali-linux:mcp}
    hostname: kali-mcp
    restart: unless-stopped
    # No published ports, host networking, Docker socket or privileged mode.
    cap_drop: [NET_RAW]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    shm_size: ${KALI_MCP_SHM_SIZE:-512m}
    mem_limit: ${KALI_MCP_MEMORY:-6g}
    pids_limit: 512
    stop_grace_period: 30s
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "/artex-kali-entrypoint.sh"]
    environment:
      MCP_GATEWAY_TOKEN: ${KALI_MCP_TOKEN:-}
      MCP_GATEWAY_TOKEN_FILE: ${KALI_MCP_TOKEN_FILE-/run/secrets/kali-mcp/token}
      MCP_GATEWAY_IP: 127.0.0.1
      MCP_GATEWAY_USE_TLS: "true"
      MCP_GATEWAY_TLS_SAN: DNS:kali-mcp
      KALI_MCP_DISABLE: ${KALI_MCP_DISABLE:-}
      KALI_MCP_BURP_ENABLED: ${KALI_MCP_BURP_ENABLED:-false}
      KALI_MCP_BURP_ACCEPT_EULA: ${KALI_MCP_BURP_ACCEPT_EULA:-false}
      BURP_HEAP: ${KALI_MCP_BURP_HEAP:-1g}
    volumes:
      - ./deploy/kali-mcp-entrypoint.sh:/artex-kali-entrypoint.sh:ro
      - ${KALI_MCP_SECRET_DIR:-./secrets/kali-mcp}:/run/secrets/kali-mcp:ro
      - kali-mcp-ssl:/opt/kali-mcp/ssl
      - kali-mcp-work:/work
      - kali-mcp-output:/opt/kali-mcp/output
      - kali-mcp-state:/opt/kali-mcp/state
    networks: [kali-link]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  kali-link:
    driver: bridge

volumes:
  kali-mcp-ssl:
  kali-mcp-work:
  kali-mcp-output:
  kali-mcp-state:
